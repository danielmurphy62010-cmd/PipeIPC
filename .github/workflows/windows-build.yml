name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: MSVC x64 / CMake
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        run: cmake -S . -B build -A x64 -DQUICKIPC_BUILD_TESTS=ON

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload executables
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: QuickIPC-windows-x64
          path: |
            build/Release/quickipc_server.exe
            build/Release/quickipc_client.exe
            build/Release/quickipc_tests.exe
          if-no-files-found: error
          retention-days: 14
